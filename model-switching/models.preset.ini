# llama.cpp server router presets.
# Section name = model ID (flat .gguf filename without extension in --models-dir).
# Keys are CLI argument names. [*] applies to all models; per-model keys override.
# Hot-reloadable without restart: curl "http://<server>:8080/models?reload=1"

[*]
ngl = 99
flash-attn = on

[Qwen3.8-27B-Q4_K_M]
mmproj = /home/daryl/models/mmproj-Qwen3.8-27B-bf16.gguf
ctx-size = 131072
cache-type-k = q8_0
cache-type-v = q8_0
load-on-startup = true
# temporary alias so the pre-migration opencode session (which sends "my-model")
# keeps working; remove once all clients use the canonical model IDs
alias = my-model,llama-cpp/my-model

[Qwen_Qwen3.6-35B-A3B-Q4_K_M]
mmproj = /home/daryl/models/mmproj-BF16.gguf
ctx-size = 130000
cache-type-k = f16
cache-type-v = f16
